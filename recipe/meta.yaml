{% set version = "3.0.0" %}
{% set js_version = version.replace('rc', '-rc').replace('a', '-alpha').replace('b', '-beta') %}

package:
  name: ipyelk
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/i/ipyelk/ipyelk-{{ version }}.tar.gz
  sha256: b14446bcb39492bc58beb8418471fe844978297b08fb58757df31aad05830ea5

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - flit-core >=3.12,<4
    - pip
    - python {{ python_min }}
  run:
    - ipywidgets >=8.0.1,<9
    - jsonschema >=4.18
    - networkx
    - pydantic >=2.12,<3
    - python >={{ python_min }}
  run_constrained:
    - jupyterlab >=4.1,<5

test:
  imports:
    - ipyelk
    - ipyelk.diagram
    - ipyelk.elements
    - ipyelk.loaders
    - ipyelk.pipes
    - ipyelk.schema
    - ipyelk.tools
    - ipyelk.contrib.library
    - ipyelk.contrib.molds

  commands:
    - python -m pip check
    - jupyter labextension list
    - jupyter labextension list 1>labextensions 2>&1
    - grep -iE "@jupyrdf/jupyter-elk.*v{{ js_version }}.*OK" labextensions
  requires:
    - jupyterlab
    - m2-grep  # [win]
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jupyrdf/ipyelk
  summary: ELK widget for Jupyter
  license: BSD-3-Clause AND EPL-1.0 AND EPL-2.0
  license_file:
    - LICENSE.txt
    - COPYRIGHT.md
    - third-party/epl-v10.html
    - third-party/epl-v20.html
    - src/_d/share/jupyter/labextensions/@jupyrdf/jupyter-elk/static/third-party-licenses.json

extra:
  recipe-maintainers:
    - bollwyvl
    - dfreeman06
